<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Abyss Challenge Roller</title>
<meta name="description" content="Roll random team-building rules for a Genshin Impact Spiral Abyss challenge run.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 0C12 7 17 12 24 12C17 12 12 17 12 24C12 17 7 12 0 12C7 12 12 7 12 0Z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M7 11V8a5 5 0 0 1 10 0v3M5.5 11h13v9h-13z"/></symbol>
  <symbol id="i-lock-closed" viewBox="0 0 24 24"><path fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M7 11V8a5 5 0 0 1 10 0v3M5.5 11h13v9h-13z"/></symbol>
  <symbol id="i-reroll" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></symbol>
</svg>

<div class="sky" id="sky" aria-hidden="true"></div>
<div class="arches" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<main>
  <header>
    <div class="rule-line" aria-hidden="true"><span></span><svg class="star"><use href="#star"/></svg><span></span></div>
    <h1>Abyss Challenge</h1>
    <p class="sub">Let the stars set your terms. Build your own team, then clear the Abyss.</p>
    <div class="rule-line" aria-hidden="true"><span></span><svg class="star"><use href="#star"/></svg><span></span></div>
  </header>

  <div class="count">
    <span id="count-label">Number of rules</span>
    <div class="seg" role="radiogroup" aria-labelledby="count-label" id="count">
      <button role="radio" aria-checked="false" data-n="2">2</button>
      <button role="radio" aria-checked="true" data-n="3">3</button>
      <button role="radio" aria-checked="false" data-n="4">4</button>
    </div>
  </div>

  <ol id="list"></ol>

  <div class="actions">
    <button id="roll" class="btn primary">Roll the rules</button>
    <button id="copy" class="btn">Copy link</button>
  </div>

  <footer>Fan-made, unofficial. Not affiliated with HoYoverse. Genshin Impact is a trademark of its owners.</footer>
</main>
<script type="module" src="src/app.js"></script>
</body>
</html>
