<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abyss Challenge Roller</title>
<meta name="description" content="Roll random team-building rules for a Genshin Impact Spiral Abyss challenge run.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 0C12 7 17 12 24 12C17 12 12 17 12 24C12 17 7 12 0 12C7 12 12 7 12 0Z"/></symbol>
  <symbol id="i-reroll" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></symbol>
</svg>

<main>
  <header>
    <h1>Abyss Challenge</h1>
    <p class="sub">Random team rules for a Spiral Abyss run. Build your own party, within the rules.</p>
  </header>

  <div class="count">
    <span id="count-label">Rules</span>
    <div class="tokens" role="radiogroup" aria-labelledby="count-label" id="count">
      <button role="radio" aria-checked="false" data-n="2">2</button>
      <button role="radio" aria-checked="true" data-n="3">3</button>
      <button role="radio" aria-checked="false" data-n="4">4</button>
    </div>
  </div>

  <details class="filters">
    <summary>Filters <small id="filter-note">all rules</small></summary>
    <div class="filter-body" id="filter-body"></div>
  </details>
  <p class="msg" id="msg" hidden></p>

  <ol id="list"></ol>

  <div class="actions">
    <button id="roll" class="btn primary">Draw rules</button>
    <button id="copy" class="btn">Copy link</button>
    <button id="sound" class="btn quiet" aria-pressed="true">Sound on</button>
  </div>

  <footer>Fan-made and unofficial. Not affiliated with HoYoverse. Genshin Impact is a trademark of its owners.</footer>
</main>

<script type="module" src="src/app.js"></script>
</body>
</html>
