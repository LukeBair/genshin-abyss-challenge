<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Abyss Challenge Roller</title>
<meta name="description" content="Roll random team-building rules for a Genshin Impact Spiral Abyss challenge run.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 0C12 7 17 12 24 12C17 12 12 17 12 24C12 17 7 12 0 12C7 12 12 7 12 0Z"/></symbol>
  <symbol id="i-reroll" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></symbol>
</svg>

<div class="beam" aria-hidden="true"></div>
<div class="dust" id="dust" aria-hidden="true"></div>

<main>
  <header>
    <svg class="astrolabe" viewBox="0 0 200 200" aria-hidden="true">
      <g class="ring-a" fill="none" stroke="currentColor">
        <circle cx="100" cy="100" r="96" stroke-width="1.5"/>
        <circle cx="100" cy="100" r="90" stroke-width="7" stroke-dasharray="1.2 9.92" opacity=".85"/>
        <circle cx="100" cy="100" r="82" stroke-width="1"/>
      </g>
      <g class="ring-b" fill="none" stroke="currentColor">
        <circle cx="100" cy="100" r="64" stroke-width="1.2"/>
        <circle cx="100" cy="100" r="56" stroke-width="1" stroke-dasharray="3 5"/>
        <path d="M100 30V170M30 100H170" stroke-width="1"/>
        <path d="M51 51L149 149M149 51L51 149" stroke-width=".6" opacity=".6"/>
      </g>
      <use href="#star" x="64" y="64" width="72" height="72" fill="currentColor"/>
      <circle cx="100" cy="100" r="5" fill="#1b1511"/>
    </svg>
    <h1>Abyss Challenge</h1>
    <p class="sub">A commission from the scholars of the archive. Choose your own party, but abide by the terms.</p>
  </header>

  <div class="count">
    <span id="count-label">Terms to draw</span>
    <div class="tokens" role="radiogroup" aria-labelledby="count-label" id="count">
      <button role="radio" aria-checked="false" data-n="2">2</button>
      <button role="radio" aria-checked="true" data-n="3">3</button>
      <button role="radio" aria-checked="false" data-n="4">4</button>
    </div>
  </div>

  <ol id="list"></ol>

  <div class="actions">
    <button id="roll" class="btn primary">Draw the terms</button>
    <button id="copy" class="btn">Copy link</button>
  </div>

  <footer>Fan-made and unofficial. Not affiliated with HoYoverse. Genshin Impact is a trademark of its owners.</footer>
</main>
<script type="module" src="src/app.js"></script>
</body>
</html>
